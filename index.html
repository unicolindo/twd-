<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz The Walking Dead</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-container">
    <h1>Quiz: The Walking Dead</h1>
    
    <div id="quiz-box">
      <div class="quiz-header">
        <span id="question-number">Pergunta 1 de 30</span>
        <span id="score-tracker">Pontos: 0</span>
      </div>
      
      <h2 id="question-text">Carregando pergunta...</h2>
      
      <div id="options-container" class="options-grid"></div>

      <div id="feedback" class="feedback"></div>

      <button id="next-btn" class="btn" style="display: none;">Próxima Pergunta</button>
    </div>

    <div id="result-box" style="display: none;">
      <h2>Quiz Concluído!</h2>
      <p id="final-score">Você acertou 0 de 30 perguntas.</p>
      <button onclick="location.reload()" class="btn">Jogar Novamente</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
